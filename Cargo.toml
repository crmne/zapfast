[package]
name = "zapfast"
version = "0.16.5"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A native WhatsApp client built with Rust and egui"
homepage = "https://zapfast.rocks"
repository = "https://github.com/crmne/zapfast"
keywords = ["whatsapp", "chat", "egui", "messaging"]
categories = ["gui"]

[lib]
name = "zapfast"
path = "src/lib.rs"

[[bin]]
name = "zapfast"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Hashes saved stickers by content. Already included through wacore.
sha2 = "0.11"
# Already in the tree through rustls; verifies lock codes.
ring = "0.17"
# Decrypts Signal sticker packs. All four crates are already included through
# wacore at these versions.
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
hkdf = "0.13"
hmac = "0.13"
# Reads .wastickers zip archives.
zip = { version = "5", default-features = false, features = ["deflate"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
directories = "6"
# UI framework. glow avoids the larger wgpu dependency.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "links", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["file", "image", "svg", "webp", "gif"] }
# Reads the colour emoji font's bitmaps and ligatures. Keep skrifa aligned with
# epaint to avoid compiling two versions.
skrifa = "0.44"
# Decodes JPEG, PNG, WebP, and GIF images.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# WhatsApp Web protocol: pairing, encryption, history sync, and media. Version
# 0.7.0 on crates.io enables `simd`, which needs nightly Rust. This commit builds
# on stable and includes snapshot recovery and no-progress conflict handling
# (upstream #1365, #1374 and #1375). Selected features provide Tokio transport, ureq media downloads,
# and the SQLite device store. The window handles shutdown instead of `signal`.
# Includes upstream Business pairing (#1440), LockChatUpdate and snapshot replay
# (#1507), the viewer's channel mute state (#1537), favorite and recent sticker
# sync events (#1538), boolean AB props (#1539), and favorite chats sync
# (#1544). Device-store
# compatibility retains the legacy created_at column.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "f7468ae2920a2b0aedbd0848cf121de56a07f93c", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net", "io-util"] }
# Opens the WhatsApp WebSocket through a proxy. Both crates are already
# included through the Tokio transport at these versions.
tokio-websockets = { version = "0.13.3", default-features = false, features = ["client"] }
http = "1"
# Encodes HTTP proxy credentials. Already included through several crates.
base64 = "0.22"
# SQLCipher encrypts the archive; the device store shares the same library.
# Bundle OpenSSL so all release platforms use the same encryption provider.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring-core = "1"
getrandom = "0.4"
zeroize = "1"
rand = "0.10"
# The updater's HTTP client, with the proxy setting.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
qrcode = { version = "0.14", default-features = false }
# Downloads profile pictures. The protocol library already includes this crate
# and TLS stack.
ureq = { version = "3", default-features = false, features = ["rustls", "socks-proxy"] }
jiff = "0.2"
# Treats joined emoji as one grapheme. Already included through egui.
unicode-segmentation = "1"
# Unicode bidi properties; already included through URL/IDNA handling.
icu_properties = "2.3"
# Unicode Bidirectional Algorithm for mixed Hebrew, Arabic, and Latin text.
unicode-bidi = "0.3.18"
# Canonical decomposition for accent-insensitive chat/contact search.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Opens downloaded attachments in their default desktop apps.
open = "5"
# File picker, clipboard images, and MIME detection for attachments. Clipboard
# text support is already included through egui-winit, and MIME detection
# through egui_extras.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
mime_guess2 = "2"
# Emoji names, groups, and shortcodes for picker search.
emojis = "0.9"

# Rasterizes the SVG logo for windows, the tray, and notifications. Already
# included through egui_extras.
resvg = { version = "0.45", default-features = false }

# Desktop notifications through D-Bus on Linux and system frameworks elsewhere.
notify-rust = { version = "4", default-features = false, features = ["z"] }
openh264 = "0.9"
mp4 = "0.14"
# The 0.22 release ends the sound of an interleaved MP4 at the first packet of
# another track, so a video that has a picture and a sound track plays a tenth
# of a second of audio and the listener hears silence. This revision is the
# merge of upstream RustAudio/rodio#833, which skips the packets of every track
# but the selected one. Drop the pin at the first release that carries it.
rodio = { git = "https://github.com/RustAudio/rodio", rev = "e89e685d326a684b298c5138adf94caa49e5568c", default-features = false, features = ["playback", "recording", "mp3", "mp4", "wav", "vorbis"] }
opus = "0.4"
ogg = "0.9"
# Converts animated Signal APNG stickers to the animated WebP used by WhatsApp.
webp-animation = "0.10"
# Encodes stickers made from pictures as still lossy WebP. Already included
# through webp-animation, whose animation encoder always writes an animation.
libwebp-sys2 = { version = "0.2", features = ["1_2"] }
# Shared foundation of Carmine's egui apps (github.com/crmne/fastframe). Every
# crate comes from the same revision.
# Bundled gettext catalogs: lookups and system language detection.
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.1.0" }
# The icons! table, a loader that survives reduce_texture_memory, and the Lucide
# icons shared with Spotifast.
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.1.0" }
# Bundled Inter with tabular figures, and installed fonts for other scripts.
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.1.0" }
# Follows the desktop's hinting and glyph coverage, live through the portal.
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.1.0", features = ["watch"] }
# Palette files, the shared presets, and following Omarchy's theme live.
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.1.0" }
# Logs to stderr and a per-run file, and records panics without their payload.
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.1.0" }
# The tray item: StatusNotifier on Linux, tray-icon on Windows and macOS.
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.1.0" }
# Keeps ZapFast running without a window and recovers off-screen windows.
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.1.0" }
# Centres the macOS traffic lights on ZapFast's own header.
fastframe-macos = { git = "https://github.com/crmne/fastframe", tag = "v0.1.0" }
# Self-update from GitHub releases with signed checksums, a helper and rollback.
fastframe-update = { git = "https://github.com/crmne/fastframe", tag = "v0.1.0", features = ["reqwest"] }

[patch.crates-io]
# crmne/egui apps-0.36, shared with Spotifast, RekordFlash and TonePush: egui
# 0.36.1 with right-to-left shaping and glyph clusters from crmne/zapfast#144
# and digits shaped left to right in text without right-to-left letters (#184)
# (emilk/egui#8577), egui's busy-loop fix (emilk/egui#8398), and eframe pacing
# Wayland frames by the compositor's frame callbacks so a window the
# compositor stops showing never blocks in a vsync swap (emilk/egui#8631).
# Every egui crate comes from the same revision so they share one emath and
# epaint. Drop this once egui releases all three.
ecolor = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
eframe = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
emath = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
epaint = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
# crmne/winit apps-0.30, shared with the same apps: winit 0.30.13 plus Wayland
# `Occluded` for the xdg-shell suspended state with commits on the app's behalf
# while it isn't presenting (rust-windowing/winit#4709, #4710), macOS Quit
# through close requests (winit#4692), and file drag and drop on Wayland
# through the data device (#178), which upstream only has in 0.31's new API
# (winit#4571). eframe from the fork above calls the Occluded API.
winit = { git = "https://github.com/crmne/winit", rev = "fc4f39ff0993dd235952b749dd16b856c0194e1f" }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
# Pauses MPRIS media players while recording or playing voice messages, and
# emits the Unity Launcher API signal launchers show as a taskbar badge.
# Already in the tree through notify-rust and fastframe-tray.
zbus = { version = "5.19", default-features = false, features = ["blocking-api", "tokio"] }
# Reads the time locale's clock format.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
# The application menu bar, built with tray-icon's muda at the version
# fastframe-tray uses.
tray-icon = { version = "0.24", default-features = false }
# AppKit calls for the application menus and editing commands, on the main
# thread.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSText", "NSView", "NSWindow"] }
# Reads the locale's clock format.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDateFormatter", "NSFormatter", "NSLocale", "NSString"] }
# Draws emoji with Apple Color Emoji through CoreText, into a bitmap context.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFAttributedString", "CFCGTypes", "CFDictionary", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "CTFont", "CTFontTraits", "CTLine", "CTRun", "CTStringAttributes"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }
winrt-notification = { package = "tauri-winrt-notification", version = "0.7.3" }
# Registry and locale calls.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Registry"] }
# Pauses other apps' media through the system media transport controls while
# recording or playing voice messages. The same version cpal already uses.
windows = { version = "0.62", features = ["Media_Control", "Foundation_Collections"] }

# The icon and version information Windows shows for the executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
# Checks the default log filter the way fastframe-log's logger reads it.
# Already in the tree through fastframe-log, at this version.
env_logger = { version = "0.11", default-features = false }
# Creates small APNGs in sticker-import tests. Already included through image.
png = "0.18"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Finds and triggers application menu items in the menu test.
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSMenu", "NSMenuItem"] }

# AppKit menus run on the main thread, which libtest does not test on.
[[test]]
name = "macos_menu"
harness = false

[features]
# Sample data, layout tests, and screenshots. Not used in release builds.
demo = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Optimize dependencies in development for usable decryption and UI layout.
# Keep the application crate incremental.
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
# Compiles the PO catalogs to Rust, leaving out unfinished entries. Ordinary
# builds do not need gettext tools.
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.1.0", features = ["build"] }
