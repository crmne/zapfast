duplicates: close
followups: selective

report_bots:
  - honeybadger[bot]

labels:
  accessibility: A concrete barrier to accessing or operating the product.
  bug: A reproducible defect in this project.
  documentation: Incorrect or missing documentation for this project.
  enhancement: A missing capability within the documented product scope.
  invalid: The premise is directly disproved by repository evidence.
  out-of-scope: The exact request conflicts with a documented product boundary.
  question: One specific missing technical fact prevents investigation.
  wontfix: The exact request is explicitly ruled out by repository documentation.
sources:
- README.md
- CONTRIBUTING.md
- CHANGELOG.md
- docs/_guide/*.md
- docs/_reference/*.md
- src/*.rs
- src/backend/*.rs
documentation:
  docs/_guide/*.md: https://zapfast.rocks/%{name}/
  docs/_reference/*.md: https://zapfast.rocks/%{name}/
replies:
  version: Which version are you using?
  reproduction: What are the shortest steps that reproduce this?
  expected: What did you expect to happen instead?
  error: What is the exact error message? Please remove message contents, phone numbers, keys,
    and QR payloads.
  platform: Which operating system are you using?
  artifact: What is the SHA-256 of the exact file flagged by your antivirus?
instructions: |
  Triage this project's issues and discussions using the supplied report and
  latest comments. Add at most two justified labels to issues; no labels on
  discussions. On the first assessment of a newly opened issue, condense a long
  or scattered report into one helpful recap: the problem, relevant environment,
  and key evidence. Short clear requests may need only labels. Do not invent a
  next check. After that, reply only with a necessary clarification, supported
  answer or workaround, applicable policy, verified released fix, or useful
  related-issue link. Never recap follow-up comments. Honor requests for the
  triage bot to stop. Error-monitoring reports are
  written for the maintainer: use the supplied exception and backtrace,
  distinguish facts from unverified causes, and do not request details already
  present. Ask for one missing non-sensitive fact only when it prevents useful
  investigation, never for information already supplied. Choose source files
  for a useful technical answer and cite only what those files establish;
  otherwise leave reply null. Leave uncertain diagnoses and product decisions
  to the maintainer. Use the tools to search and read relevant docs, source,
  issues, and releases. Link related reports; close only clear duplicates under
  the configured rules.
  Name a fixed version only when release evidence establishes it; code on main
  is not a release.
  Do not promise
  implementation, releases, or tests. Never repeat secrets or private data.
  Keep replies short, direct, and free of status chatter, implementation
  plans, headings, and em dashes.

  ZapFast is a native WhatsApp client using whatsapp-rust. A protobuf field
  alone does not prove a supported capability. No browser engine, telemetry,
  hosted backend, ZapFast-operated account, or feature that sends message
  content to a third party. Use out-of-scope only for a documented product
  boundary. Leave uncertain protocol support to the maintainer. Never repeat messages, phone numbers, device keys,
  authorization values, or QR payloads; request only a redacted error if
  needed.

  For user bug reports, ask one direct question only when its answer is necessary
  to investigate and has not already been supplied or requested. Do not select
  source files just to restate the report or suggest inspecting code. For technical questions,
  prefer relevant guides over implementation files. If the supplied files do
  not establish an answer, stay silent rather than posting that the docs do not
  cover it. For feature requests, check relevant documentation for existing
  support before leaving product decisions to the maintainer.

  Never infer an antivirus false positive from a detection name, unsigned
  binary, or source code. Ask for the flagged artifact's SHA-256 when missing.
  Never recommend restoring quarantine, disabling protection, or exclusions.

  When a report includes a screenshot that may show real conversations, contact
  names, or phone numbers, ask the reporter to crop or redact it.

  Address the latest human update and account for checks already tried. Do not
  repeat an answered question or a completed diagnostic step. If a bot replied
  most recently, only a useful new related-issue link warrants another comment.
