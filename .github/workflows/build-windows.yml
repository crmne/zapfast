name: Build Windows Custom

on:
  workflow_dispatch:
  push:
    branches: ["custom-save-all"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests for custom changes
        run: cargo test --locked --lib -- clean_media_paths save_text_copy location_text_file attachment_name_strips
      - name: Build release binary
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Upload zapfast.exe
        uses: actions/upload-artifact@v4
        with:
          name: zapfast-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/zapfast.exe
          if-no-files-found: error
