name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Baked into the binary by settings.rs; releases built without the
  # secret simply ship keyless and the picker asks for one.
  ZAPFAST_GIPHY_KEY: ${{ secrets.ZAPFAST_GIPHY_KEY || secrets.FASTSAPP_GIPHY_KEY }}

jobs:
  release-source:
    name: tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the release commit on main
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tags must point to a commit already on origin/main." >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: release-source
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    # The Windows jobs sign in to Azure Artifact Signing as the app
    # registration that trusts only this environment, which deploys only
    # from v* tags (PACKAGING.md, "Windows signing").
    environment: ${{ startsWith(matrix.os, 'windows') && 'windows-signing' || '' }}
    # The Artifact Signing account native-packages signs with; empty
    # outside the windows-signing environment, which leaves builds unsigned.
    env:
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
    # Linux builds run in Debian 12: the binary needs the glibc it was built
    # against or newer (2.36), and bookworm's libpipewire (0.3.65) meets the
    # PipeWire output's 0.3.53, which Ubuntu 22.04's does not. The packages
    # install on Debian 12, Ubuntu 22.10, Fedora 37 and newer. Windows rows
    # leave it empty and run on the host.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: debian:12
          # A native arm64 runner, so the GUI's system libraries need no
          # cross-compilation sysroot.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: debian:12
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Cross-compiled from x64: the MSVC arm64 linker ships with the
          # runner's Visual Studio.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      # Before checkout and rustup: the bare image has no curl, git or
      # certificates. Steps run as root, without sudo.
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev \
            libpipewire-0.3-dev clang libclang-dev cmake perl
      - uses: actions/checkout@v7
      - name: Check release version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository pins its toolchain; add the cross-target's standard
      # library to the toolchain the pin actually resolves to.
      - run: rustup target add ${{ matrix.target }}
      # No compiler cache: published binaries never build from outputs
      # restored from an Actions cache.
      - run: cargo build --locked --release --target ${{ matrix.target }}

      # native-packages signs the Windows code (native-packages.yaml,
      # windows.signing) through the Azure CLI sign-in below, once the
      # windows-signing environment names a certificate profile.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: runner.os == 'Windows'
        with:
          ruby-version: '4.0'
      - name: Install native-packages
        if: runner.os == 'Windows'
        run: gem install native-packages --version 0.11.0 --no-document
      - name: Sign in to Azure for code signing
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_PROFILE != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Signed before anything packs them, so the zip and the MSI both carry
      # signed binaries.
      - name: Sign the binaries
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_PROFILE != ''
        shell: pwsh
        run: native-packages sign-windows target\${{ matrix.target }}\release\zapfast.exe

      - name: Package
        shell: bash
        run: |
          name="zapfast-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/zapfast.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/zapfast" "dist/$name/"
          fi
          cp README.md LICENSE THIRD-PARTY-NOTICES.md packaging/zapfast-portable.txt "dist/$name/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Desktop integration for package builds and hand-installs.
            cp --parents packaging/applications/zapfast.desktop packaging/icons/zapfast.svg contrib/omarchy/zapfast.json.tpl contrib/omarchy/zapfast-theme "dist/$name/"
          fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      # The Windows installer: a per-user Windows Installer package, which also
      # takes over a copy the Inno Setup program of 0.20.1 and earlier
      # installed (PACKAGING.md, "Windows installer"). native-packages signs
      # it before recording its checksum.
      - name: Windows Installer package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:Path += ";$env:USERPROFILE\.dotnet\tools"
          $target = "${{ matrix.target }}"
          $payload = "dist\windows-input-$target"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item "target\$target\release\zapfast.exe", README.md, LICENSE, THIRD-PARTY-NOTICES.md, `
            packaging\windows\zapfast-installer.txt $payload
          $packageTarget = if ($target.StartsWith("aarch64")) { "windows-arm64" } else { "windows-amd64" }
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          native-packages build --version $version --target $packageTarget `
            --defer-recipes --output "$env:RUNNER_TEMP\windows-packages"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP\windows-packages\packages\$packageTarget\msi\*.msi" dist\
          Remove-Item -Recurse $payload
      - name: Attest release packages
        uses: crmne/native-packages/.github/actions/attest@25a4214d2f203357c84b069f39de7c17c0be6253 # v0.11.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  macos:
    name: macOS universal app
    needs: release-source
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: macos-latest
    env:
      # Complete Apple credentials enable native-packages signing/notarization.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # No compiler cache, as in the build job above.
      - name: Build both architectures
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/zapfast \
            target/x86_64-apple-darwin/release/zapfast \
            -output universal/zapfast
          # The two release builds fill most of the runner's disk; the DMG
          # and its notarization copy need room of their own.
          rm -rf target
          df -h "$RUNNER_TEMP"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install native packaging
        run: gem install native-packages --version 0.11.0 --no-document

      - name: App bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/macos-input
          bash packaging/macos/bundle.sh universal/zapfast dist/macos-input/ZapFast.app "$version"
          cp README.md LICENSE THIRD-PARTY-NOTICES.md dist/macos-input/

      - name: Package, sign and notarize macOS app
        run: |
          native-packages build \
            --version "${GITHUB_REF_NAME#v}" --target macos-universal --defer-recipes \
            --output "$RUNNER_TEMP/macos-packages"
          cp "$RUNNER_TEMP/macos-packages/packages/macos-universal/dmg/"*.dmg dist/

      - name: Verify the notarized release app
        run: bash packaging/macos/verify.sh "dist/zapfast-${GITHUB_REF_NAME}-macos-universal.dmg"

      - name: Attest macOS package
        uses: crmne/native-packages/.github/actions/attest@25a4214d2f203357c84b069f39de7c17c0be6253 # v0.11.0
        with:
          subject-path: dist/*.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  # The Linux build packaged as a Flatpak bundle: the same binary, in the
  # sandbox packaging/flatpak describes, so nothing compiles twice. Flathub
  # builds from source on its own machines, from the manifest beside it.
  flatpak:
    name: Flatpak bundle
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - name: Unpack the Linux build
        run: |
          tar xzf dist/zapfast-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz -C packaging/flatpak
          mv packaging/flatpak/zapfast-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu packaging/flatpak/built
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/rocks.zapfast.ZapFast.bundle.yml
          bundle: zapfast-${{ github.ref_name }}-x86_64.flatpak
          cache: false
          upload-artifact: false
      - name: Attest Flatpak bundle
        uses: crmne/native-packages/.github/actions/attest@25a4214d2f203357c84b069f39de7c17c0be6253 # v0.11.0
        with:
          subject-path: "*.flatpak"
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: "*.flatpak"
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: [build, macos, flatpak]
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '4.0'
      - name: Sign update manifest
        uses: crmne/native-packages/.github/actions/sign-release@25a4214d2f203357c84b069f39de7c17c0be6253 # v0.11.0
        with:
          directory: dist
          public-key: assets/update-public-key.hex
          key-env: ZAPFAST_UPDATE_SIGNING_KEY
        env:
          ZAPFAST_UPDATE_SIGNING_KEY: ${{ secrets.ZAPFAST_UPDATE_SIGNING_KEY }}
      # Publish the reviewed notes committed before the tag, never a
      # generated summary. A stable tag without them stops here; a
      # prerelease without them gets a short placeholder.
      - name: Release notes
        run: |
          notes="packaging/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "Prerelease build of ZapFast ${GITHUB_REF_NAME}." > release-notes.md
          else
            echo "::error::Write $notes and push it before tagging a stable release."
            exit 1
          fi
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          name: ZapFast ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          draft: ${{ contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}

  packaging:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: publish
    uses: ./.github/workflows/packaging.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
