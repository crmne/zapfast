# Temporary, for review of voice message transcription: recognises synthetic
# speech with the packaged runtime and a pinned model on every platform.
# It runs in the contributor's fork only, and goes before the branch merges.
name: Speech smoke

on:
  push:
    branches: [voice-transcription]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fixture:
    name: synthetic speech
    if: github.repository != 'crmne/zapfast'
    runs-on: ubuntu-24.04
    steps:
      - name: Speak and encode a sentence as a WhatsApp voice message would be
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng opus-tools
          espeak-ng -v en-us -s 140 -w speech.wav \
            "The quick brown fox jumps over the lazy dog. Please meet me at the train station at seven."
          opusenc --quiet --bitrate 32 speech.wav speech.ogg
      - uses: actions/upload-artifact@v7
        with:
          name: speech
          path: speech.ogg

  recognize:
    name: recognize (${{ matrix.name }})
    needs: fixture
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-24.04, runtime: x86_64-unknown-linux-gnu, library: libonnxruntime.so, packaged: ../lib/zapfast }
          - { name: Linux arm64, os: ubuntu-24.04-arm, runtime: aarch64-unknown-linux-gnu, library: libonnxruntime.so, packaged: ../lib/zapfast }
          # Where the release's Linux builds are made, with its oldest glibc.
          - { name: Debian 12 x64, os: ubuntu-24.04, container: 'debian:12', runtime: x86_64-unknown-linux-gnu, library: libonnxruntime.so, packaged: ../lib/zapfast }
          - { name: Windows x64, os: windows-latest, runtime: x86_64-pc-windows-msvc, library: onnxruntime.dll, packaged: . }
          - { name: Windows arm64, os: windows-11-arm, runtime: aarch64-pc-windows-msvc, library: onnxruntime.dll, packaged: . }
          - { name: macOS Intel, os: macos-15-intel, runtime: universal-apple-darwin, library: libonnxruntime.dylib, packaged: ../Frameworks }
    defaults:
      run:
        shell: bash
    env:
      ZAPFAST_ASR_EXPECTED: dog
    steps:
      - name: Debian build dependencies
        if: matrix.container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev \
            libpipewire-0.3-dev clang libclang-dev cmake perl python3
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        if: ${{ !matrix.container }}
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: GUI build dependencies
        if: runner.os == 'Linux' && !matrix.container
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libpipewire-0.3-dev clang libclang-dev cmake perl
      - uses: actions/download-artifact@v7
        with:
          name: speech
          path: speech
      - name: The runtime the release puts beside ZapFast
        run: |
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" packaging/onnxruntime.py ${{ matrix.runtime }} runtime
          ls -l runtime
      - name: Build the tests
        run: cargo test --locked --lib --no-run
      - name: Runtime, idle reload and a model switch (v3 FP32, then INT8)
        run: |
          export ORT_DYLIB_PATH="$PWD/runtime/${{ matrix.library }}"
          export ZAPFAST_ASR_FIXTURE="$PWD/speech/speech.ogg" ZAPFAST_ASR_MODELS="$PWD/models"
          export ZAPFAST_ASR_SWITCH_MODEL=parakeet-v3-int8
          cargo test --locked --lib -- --ignored --test-threads=1 --nocapture 'transcribe::tests::'
      - name: The runtime found where packages put it, relative to the executable
        run: |
          export ZAPFAST_ASR_FIXTURE="$PWD/speech/speech.ogg" ZAPFAST_ASR_MODELS="$PWD/models"
          mkdir -p "target/debug/deps/${{ matrix.packaged }}"
          cp "runtime/${{ matrix.library }}" "target/debug/deps/${{ matrix.packaged }}/"
          cargo test --locked --lib -- --ignored --exact --nocapture 'transcribe::tests::native_model_transcribes_an_explicit_fixture'
      - name: Parakeet Ultra
        if: matrix.name == 'Linux x64' || matrix.name == 'Windows x64'
        run: |
          export ORT_DYLIB_PATH="$PWD/runtime/${{ matrix.library }}"
          export ZAPFAST_ASR_FIXTURE="$PWD/speech/speech.ogg" ZAPFAST_ASR_MODELS="$PWD/models"
          export ZAPFAST_ASR_MODEL=parakeet-ultra-fp32
          cargo test --locked --lib -- --ignored --exact --nocapture 'transcribe::tests::native_model_transcribes_an_explicit_fixture'
      - name: The app starts with the telemetry guard and prints its version
        run: |
          cargo build --locked
          target/debug/zapfast --version
      - name: The macOS bundle carries and signs the runtime
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/bundle.sh target/debug/zapfast "$RUNNER_TEMP/ZapFast.app" 0.0.0 runtime
          codesign --verify --strict --deep "$RUNNER_TEMP/ZapFast.app"
          lipo -info "$RUNNER_TEMP/ZapFast.app/Contents/Frameworks/libonnxruntime.dylib"
          ls "$RUNNER_TEMP/ZapFast.app/Contents/Resources"/onnxruntime-*
      - name: What the Windows runtime imports, and its signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-AuthenticodeSignature runtime\onnxruntime.dll | Format-List Status, SignerCertificate
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          & $dumpbin.FullName /nologo /dependents runtime\onnxruntime.dll
          & $dumpbin.FullName /nologo /dependents target\debug\zapfast.exe

  # The suites ci.yml runs on these systems only on main.
  suites:
    name: tests (${{ matrix.os }})
    if: github.repository != 'crmne/zapfast'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Tests (default features)
        run: cargo test --locked --all-targets
      - name: Tests (all features)
        run: cargo test --locked --all-targets --all-features

  # The Nix packages ci.yml builds only on main, and the runtime path they bake in.
  nix:
    name: Nix package (${{ matrix.system }})
    if: github.repository != 'crmne/zapfast'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, system: aarch64-linux }
          - { os: macos-latest, system: aarch64-darwin }
    steps:
      - uses: actions/checkout@v7
      - uses: wimpysworld/nothing-but-nix@v9
        if: runner.os == 'Linux'
      - uses: cachix/install-nix-action@v31
      - name: Check flake outputs
        run: nix flake check --no-build
      - name: Build package
        run: nix build .#default --print-build-logs
      - name: The binary names the packaged runtime, which is intact
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            binary=result/Applications/ZapFast.app/Contents/MacOS/zapfast
          else
            binary=result/bin/.zapfast-wrapped
          fi
          runtime=$(grep -a -o -m1 -E '/nix/store/[a-z0-9]{32}-zapfast-onnxruntime-1\.23\.2/lib/libonnxruntime\.(so|dylib)' "$binary" | head -1)
          echo "$runtime"
          test -f "$runtime"
          if [ "$RUNNER_OS" = macOS ]; then codesign --verify --strict "$runtime"; fi
          nix-store --query --references "$(readlink -f result)" | grep zapfast-onnxruntime
