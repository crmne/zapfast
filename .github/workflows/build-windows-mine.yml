name: build-windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-msvc

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --locked --lib

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapfast-media-folders
          path: target/release/zapfast.exe

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: build-media-${{ github.run_number }}
        run: gh release create "$env:TAG" "target/release/zapfast.exe" --title "$env:TAG" --notes "zapfast media-per-chat-folder ${{ github.sha }}"
